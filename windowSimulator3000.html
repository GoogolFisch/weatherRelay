<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Window Simulator 3000</title>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<style>
.red{color:brown}
.blue{color:darkblue}
</style>
	<script>
	var socket = io();
	socket.emit("getWeatherNow", "1");  // Notify server of new user

	// Listen for messages from server
	socket.on("setWeatherNow", function(rdata) {
		var messages = document.getElementById("Weather");
		var htTempRange = document.getElementById("htTRange");
		var wnTempRange = document.getElementById("wnTRange");
		let data = JSON.parse(rdata);
		let output = ""
		for(var key in data){
			var value = data[key];
			output += `<p `;
			if(value.temperature < htTempRange.value){
				output += `class="red">At ${value.name} is it ${value.temperature}°C and too cold, you have to turn on the heater!`;
			}else if(value.temperature > wnTempRange.value){
				output += `class="blue">At ${value.name} is it too hot, opening a window... (${value.temperature}°C)`;
			}else{
				output += `>At ${value.name} is it ${value.temperature}°C`;
			}
			//output += `${value}`;
			output += "</p>";
		}
		messages.innerHTML = `${output}`;
	});

	setInterval('socket.emit("getWeatherNow","1");',6000);
	</script>
</head>
<body>
	<h1>Fenster Simulator</h1>
	<script>
	</script>
	<label for="htTRange" class="red">Room-heater threshhold:</label>
	<input type="range" min="5" max="20" value="15" id="htTRange"
	oninput="document.getElementById('tempRangeOut').innerHTML = event.target.value + '°C';">
	<output id="tempRangeOut">20°C</output>
	<br>

	<label for="wnTRange" class="blue">Window opener threshhold:</label>
	<input type="range" min="20" max="25" value="24" id="wnTRange"
	oninput="document.getElementById('WnTRangeO').innerHTML = event.target.value + '°C';">
	<output id="WnTRangeO">24°C</output>
	<br>
	<div id="Weather"></div>

</body>
</html>
