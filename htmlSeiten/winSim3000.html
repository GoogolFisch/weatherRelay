<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Window Simulator 3000</title>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<style>
.red{color:orangered}
.blue{color:darkblue}
.black{color:darkred}
</style>
	<script>
	var socket = io();
	socket.emit("getWeatherNow", "1");  // Notify server of new user

	function WetBulb(temp,relH){
		// https://www.omnicalculator.com/physics/wet-bulb
		return temp*Math.atan(0.151977 * Math.sqrt(relH + 8.313659))
			+ 0.00391838*Math.sqrt(relH * relH * relH) * Math.atan(0.023101 * relH)
			- Math.atan(relH - 1.676331) + Math.atan(temp + relH) - 4.686035;
	}
	var manualAutoCloseWindow = 0;
	// Listen for messages from server
	socket.on("setWeatherNow", function(rdata) {
		var messages = document.getElementById("Weather");
		var htTempRange = document.getElementById("htTRange");
		var wnTempRange = document.getElementById("wnTRange");
		let data = JSON.parse(rdata);
		let output = ""
		let isDangerous,isHeater,isWindow;
		let anyDanger = false;
		for(var key in data){
			var value = data[key];
			isDangerous = WetBulb(value.temperature,value.humidity) > 30;
			isHeater = value.temperature < htTempRange.value;
			isWindow = value.temperature > wnTempRange.value;
			output += `<p `;
			if(isHeater){
				anyDanger = true;
				output += `class="red">At ${value.name} is it ${value.temperature}°C and too cold, you have to turn on the heater!`;
			}else if(isDangerous){
				anyDanger = true;
				output += `class="black">At ${value.name} is way too hot⚠️, opening a window... (${value.temperature}°C and ${value.humidity}RH%)`;
			}else if(isWindow){
				output += `class="blue">At ${value.name} is it warm, opening a window... (${value.temperature}°C)`;
			}else{
				output += `>At ${value.name} is it ${value.temperature}°C`;
			}
			//output += `${value}`;
			output += "</p>";
		}
		messages.innerHTML = `${output}`;
		messages = document.getElementById("Fenster");
		let nowDate = new Date();
		let hours = nowDate.getHours();
		let minutes = nowDate.getMinutes();
		if(nowDate.getTime() < manualAutoCloseWindow)
			messages.innerHTML = "Fenster ist vom Nutzer aufgemacht worden";
		if(anyDanger)
			messages.innerHTML = "Fenster wird geschlossen gehalten!";
		else if(hours & 3 != 0)
			messages.innerHTML = "Fenster ist nun geschlossen";
		else if(minutes >= 6)
			messages.innerHTML = "Fenster ist nun geschlossen";
		else messages.innerHTML = "Fenster ist nun offen";
		//messages.innerHTML = "Hello";
	});

	setInterval('socket.emit("getWeatherNow","1");',6000);
	</script>
</head>
<body>
	<h1>Fenster Simulator</h1>
	<script>
	</script>
	<label for="htTRange" class="red">Room-heater threshhold:</label>
	<input type="range" min="5" max="20" value="15" id="htTRange"
	oninput="document.getElementById('tempRangeOut').innerHTML = event.target.value + '°C';">
	<output id="tempRangeOut">15°C</output>
	<br>

	<label for="wnTRange" class="blue">Window opener threshhold:</label>
	<input type="range" min="20" max="25" value="24" id="wnTRange"
	oninput="document.getElementById('WnTRangeO').innerHTML = event.target.value + '°C';">
	<output id="WnTRangeO">24°C</output>
	<br>
	<p id="Fenster">Fenster ist gerade offen.</p>
	<button onclick="manualAutoCloseWindow = (new Date()).getTime() + 300 * 1000;document.getElementById('Fenster').innerHTML = 'Fenster ist gerade offen.';">Open window</button>
	<div id="Weather"></div>

</body>
</html>
