<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="/file/style.css" />
    <title>Graphen Datenübersicht</title>
    <style>
        .chart-wrap {
            max-width: 900px;
            margin: 1rem auto;
            padding: 0 1rem;
        }

        .chart-box {
            height: 360px;
            margin-bottom: 2.25rem;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <h1>Graphen</h1>
    <p>temperatur-Zeit, Luftdruck-Zeit, Wetterwarnung basiert auf Luftdruckveränderungen</p>

    <div class="chart-wrap">
        <h2>Temperatur</h2>
        <p>jede 5 Minuten</p>
        <div class="chart-box">
            <canvas id="tempChart" role="img"></canvas>
        </div>
        <h2>Luftdruck</h2>
        <p>jede 5 Minuten</p>
        <div class="chart-box">
            <canvas id="pressChart" role="img"></canvas>
        </div>
        <h2>Luftfeuchtigkeit</h2>
        <p>jede 5 Minuten</p>
        <div class="chart-box">
            <canvas id="humiChart" role="img"></canvas>
        </div>
    </div>
    <ul id="fileList">
    </ul>

    <!-- Chart.js + Luxon Adapter -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>

    <script>

function mapOfParameterBar() {
	let output = {};
	var query = window.location.search.substring(1);
	var vars = query.split("&");
	for (var i=0;i<vars.length;i++) {
		var pair = vars[i].split("=");
		output[pair[0]] = pair[1];
	} 
	return output;
}
//var gettingFile = "/data/temp.xz";
var mapOfParams = mapOfParameterBar();
var gettingFile = mapOfParams["file"] || "temp.xz";
gettingFile = "/data/" + gettingFile;
(async function(){
	let listing = document.getElementById("fileList");
	const res = await fetch("/data/a", { cache: 'no-store' });
	if (!res.ok)
		throw new Error('network');
	const j = await res.json();
	let outp = "";
	for(let x = 0;x < j.length;x++){
		outp += `<li><a href="?file=${j[x]}">${j[x]}</a></li>`;
	}
	listing.innerHTML = outp;

})();
    </script>
    <script src="/file/graphing.js"></script>
</body>
</html>
